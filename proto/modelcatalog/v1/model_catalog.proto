syntax = "proto3";

package modelcatalog.v1;

import "google/protobuf/timestamp.proto";

option go_package = "openrouter-with-deepswe/gen/modelcatalog/v1;modelcatalogv1";

// ModelCatalogService manages the catalog of OpenRouter models enriched with
// Terminal-Bench benchmark scores: toggling per-model visibility/favorite
// flags and listing models for display.
service ModelCatalogService {
  // SetFavorite explicitly sets (not toggles) the favorite flag of a model.
  rpc SetFavorite(SetFavoriteRequest) returns (SetFavoriteResponse);

  // SetHidden explicitly sets (not toggles) the hidden flag of a model.
  rpc SetHidden(SetHiddenRequest) returns (SetHiddenResponse);

  // ListModels returns models matching the given filter, including their
  // OpenRouter pricing and benchmark scores.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  // UpsertTerminalBenchScore manually records a Terminal-Bench score for a
  // model. The terminalbench batch re-upserts every matching row on each run,
  // so a later CronJob run overwrites a manual row with the same key.
  rpc UpsertTerminalBenchScore(UpsertTerminalBenchScoreRequest) returns (UpsertTerminalBenchScoreResponse);
}

message SetFavoriteRequest {
  string model_id = 1;
  bool favorite = 2;
}

message SetFavoriteResponse {
  Model model = 1;
}

message SetHiddenRequest {
  string model_id = 1;
  bool hidden = 2;
}

message SetHiddenResponse {
  Model model = 1;
}

message ListModelsRequest {
  enum Filter {
    // Same as FILTER_VISIBLE.
    FILTER_UNSPECIFIED = 0;
    // Only models that are not hidden.
    FILTER_VISIBLE = 1;
    // Only models marked as favorite (regardless of hidden).
    FILTER_FAVORITE = 2;
    // Only models marked as hidden.
    FILTER_HIDDEN = 3;
  }
  Filter filter = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message UpsertTerminalBenchScoreRequest {
  string model_id = 1;
  // Stable leaderboard version/name, for example "4-0-0" (not "latest").
  string leaderboard = 2;
  string agent = 3;
  // Empty is stored as "default".
  string reasoning_effort = 4;
  // Accuracy percentage, in the range 0..100.
  double accuracy = 5;
  // 95% confidence-interval half-width in percentage points, 0..100.
  double accuracy_ci95_half_width = 6;
}

message UpsertTerminalBenchScoreResponse {
  // The score as stored, with reasoning_effort normalized.
  TerminalBenchScore score = 1;
}

message Model {
  string id = 1;
  string name = 2;
  // Empty if no provider pricing could be resolved.
  string cheapest_provider = 3;
  // USD per token, decimal string (not a float, to avoid precision loss).
  string prompt_price = 4;
  // USD per token, decimal string (not a float, to avoid precision loss).
  string completion_price = 5;
  bool favorite = 6;
  bool hidden = 7;
  int64 context_length = 8;
  google.protobuf.Timestamp released_at = 9;
  reserved 10;
  reserved "deepswe_scores";
  repeated TerminalBenchScore terminal_bench_scores = 11;
}

message TerminalBenchScore {
  // Stable leaderboard version/name, for example "4-0-0" (not "latest").
  string leaderboard = 1;
  string agent = 2;
  string reasoning_effort = 3;
  // Original accuracy percentage, in the range 0..100.
  double accuracy = 4;
  // 95% confidence-interval half-width in percentage points.
  double accuracy_ci95_half_width = 5;
}
