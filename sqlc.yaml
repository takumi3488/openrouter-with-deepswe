version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/postgres/migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "string"
